<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Digital Twin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #081224;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 8px;
      padding: 0 12px;
      font-size: clamp(24px, 4vw, 36px);
    }

    #status {
      margin: 10px 0 14px;
      padding: 0 12px;
      font-size: clamp(13px, 2vw, 15px);
      color: #d6d6d6;
    }

    .main-layout {
      width: min(96%, 1600px);
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(0, 2fr);
      gap: 24px;
      align-items: start;
    }

    .info-panel,
    .viewer-panel {
      background: #101a2f;
      border-radius: 16px;
      padding: 20px;
      min-height: 640px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .viewer-panel {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel-title {
      text-align: left;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
      color: white;
    }

    #infoBox {
      width: 100%;
      padding: 0;
      text-align: left;
      display: block;
    }

    #infoTitle {
      margin: 0 0 16px 0;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: bold;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }

    .prop-card {
      background: #0d1730;
      border: 1px solid #2a3f69;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .prop-label {
      font-size: 13px;
      color: #9bb0d3;
      margin-bottom: 6px;
    }

    .prop-value {
      font-size: clamp(16px, 2vw, 20px);
      font-weight: bold;
      color: white;
      word-break: break-word;
    }

    .meta-row {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }

    .meta-card {
      background: #0b1428;
      border: 1px solid #223659;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .empty-note {
      color: #c7d2e6;
      font-size: 15px;
    }

    .viewer-stage {
      position: relative;
      flex: 1;
      min-height: 520px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a3f69;
      background:
        radial-gradient(circle at top, rgba(80,130,255,0.10), transparent 35%),
        linear-gradient(180deg, #0b1428 0%, #0a1324 100%);
    }

    #threeContainer {
      width: 100%;
      min-height: 520px;
      height: 100%;
      position: relative;
      touch-action: none;
    }

    #threeContainer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .control-btn {
      border: 1px solid #2a3f69;
      background: #0d1730;
      color: white;
      border-radius: 12px;
      padding: 20px 30px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .control-btn.active {
      outline: 2px solid white;
      outline-offset: 1px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 12px;
      justify-content: flex-start;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d6e1f5;
      font-size: 13px;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .viewer-note {
      margin-top: 12px;
      text-align: left;
      font-size: 13px;
      color: #b8c6df;
      line-height: 1.5;
    }

    @media (max-width: 1100px) {
      .main-layout {
        grid-template-columns: 1fr;
      }

      .info-panel,
      .viewer-panel {
        min-height: auto;
      }
    }

    @media (max-width: 700px) {
      .main-layout {
        width: 94%;
        gap: 16px;
      }

      .info-panel,
      .viewer-panel {
        padding: 14px;
        border-radius: 14px;
      }

      .prop-grid,
      .meta-row {
        grid-template-columns: 1fr;
      }

      .viewer-stage,
      #threeContainer {
        min-height: 420px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        margin-top: 16px;
      }

      #status {
        margin-bottom: 10px;
      }

      .info-panel,
      .viewer-panel {
        padding: 12px;
      }

      .prop-card,
      .meta-card {
        padding: 10px 12px;
      }

      .prop-label {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>3D Digital Twin</h1>
  <div id="status">Loading twin data...</div>
  
  <div class="main-layout">
    <div class="viewer-panel">
      <div class="panel-title">3D Twin Viewer</div>
      <div class="viewer-stage">
        <div id="threeContainer"></div>
      </div>
  
      <div class="controls-row">
        <button id="resetViewBtn" class="control-btn">Reset View</button>
        <button id="toggleColorBtn" class="control-btn">Live Room Colors: Off</button>
      </div>
  
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#35c9dc;"></span>Good</div>
        <div class="legend-item"><span class="legend-dot" style="background:#f2c94c;"></span>Moderate</div>
        <div class="legend-item"><span class="legend-dot" style="background:#eb5757;"></span>High</div>
      </div>
  
      <div class="viewer-note">
        Click a room in the 3D model to zoom in and show that room’s data.
      </div>
    </div>
  
    <div class="info-panel">
      <div class="panel-title">Room Information</div>
      <div id="infoBox">
        <h3 id="infoTitle">Select a room</h3>
        <div id="infoContent">
          <div class="empty-note">Click a room in the 3D model to view its telemetry.</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.160.0";
    import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const TELEMETRY_URL = "https://iot-dt-fn-new-bwcwe8cphmg9aren.southeastasia-01.azurewebsites.net/api/GetTwinTelemetry";

    const statusText = document.getElementById("status");
    const infoTitle = document.getElementById("infoTitle");
    const infoContent = document.getElementById("infoContent");

    const resetViewBtn = document.getElementById("resetViewBtn");
    const toggleColorBtn = document.getElementById("toggleColorBtn");
    const threeContainer = document.getElementById("threeContainer");

    const ROOM_TO_NODE = {
      Room_01: "Node_01",
      Room_02: "Node_02",
      Room_03: "Node_03",
      Room_04: "Node_04",
      Room_05: "Node_05",
      Room_06: "Node_06",
      Room_07: "Node_07",
      Room_08: "Node_08",
      Room_09: "Node_09",
      Room_10: "Node_10"
    };

    let nodes = [];
    let scene, camera, renderer, controls, raycaster, mouse;
    let modelRoot = null;
    let roomMeshes = {};
    let selectedMesh = null;
    let enableLiveColors = false;
    let defaultTarget = new THREE.Vector3(0, 0, 0);
    let defaultCameraPosition = new THREE.Vector3(16, 12, 16);

    function safeValue(value) {
      return value === null || value === undefined || value === "" ? "-" : value;
    }

    function propCard(label, value) {
      return `
        <div class="prop-card">
          <div class="prop-label">${label}</div>
          <div class="prop-value">${safeValue(value)}</div>
        </div>
      `;
    }

    function metaCard(label, value) {
      return `
        <div class="meta-card">
          <div class="prop-label">${label}</div>
          <div class="prop-value" style="font-size:16px;">${safeValue(value)}</div>
        </div>
      `;
    }

    function getRoomColor(aqi) {
      const num = Number(aqi);
      if (num === 1) return new THREE.Color("#35c9dc");
      if (num === 2) return new THREE.Color("#f2c94c");
      if (num >= 3) return new THREE.Color("#eb5757");
      return new THREE.Color("#e8e3da");
    }

    function showNodeInfo(node) {
      const t = node.telemetry || {};

      infoTitle.textContent = safeValue(t.room_no || node.label || node.id);

      if (node.telemetry) {
        infoContent.innerHTML = `
          <div class="prop-grid">
            ${propCard("AQI", t.aqi)}
            ${propCard("eCO2", t.eco2)}
            ${propCard("Humidity", t.hum)}
            ${propCard("PM1", t.pm1)}
            ${propCard("PM2.5", t.pm25)}
            ${propCard("PM10", t.pm10)}
            ${propCard("Temperature", t.temp)}
            ${propCard("TVOC", t.tvoc)}
            ${propCard("MQ", t.mq)}
            ${propCard("Packet No.", t.pkt_no)}
          </div>

          <div class="meta-row">
            ${metaCard("Twin ID", node.id)}
            ${metaCard("Payload ID", t.id)}
            ${metaCard("Room No.", t.room_no)}
            ${metaCard("Created At", t.created_at)}
            ${metaCard("Last Updated", t.lastUpdated)}
            ${metaCard("Label", node.label || node.id)}
          </div>
        `;
      } else {
        infoContent.innerHTML = `
          <div class="empty-note">No telemetry available for this room.</div>
          <div class="meta-row">
            ${metaCard("Twin ID", node.id)}
            ${metaCard("Label", node.label || node.id)}
          </div>
        `;
      }
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color("#0b1428");

      const width = threeContainer.clientWidth || 800;
      const height = threeContainer.clientHeight || 520;

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.copy(defaultCameraPosition);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      threeContainer.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.copy(defaultTarget);
      controls.minDistance = 4;
      controls.maxDistance = 50;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambient = new THREE.AmbientLight(0xffffff, 1.4);
      scene.add(ambient);

      const dir1 = new THREE.DirectionalLight(0xffffff, 1.8);
      dir1.position.set(10, 15, 10);
      scene.add(dir1);

      const dir2 = new THREE.DirectionalLight(0xffffff, 0.9);
      dir2.position.set(-8, 8, -10);
      scene.add(dir2);

      const hemi = new THREE.HemisphereLight(0xa8cfff, 0x1b2236, 1.1);
      scene.add(hemi);

      const loader = new GLTFLoader();
      loader.load(
        "./B10.glb",
        (gltf) => {
          modelRoot = gltf.scene;
          scene.add(modelRoot);

          const rawBox = new THREE.Box3().setFromObject(modelRoot);
          const rawCenter = rawBox.getCenter(new THREE.Vector3());
          modelRoot.position.sub(rawCenter);

          const sizedBox = new THREE.Box3().setFromObject(modelRoot);
          const size = sizedBox.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 8 / maxDim;
          modelRoot.scale.setScalar(scale);

          const finalBox = new THREE.Box3().setFromObject(modelRoot);
          const finalCenter = finalBox.getCenter(new THREE.Vector3());

          defaultTarget.copy(finalCenter);
          controls.target.copy(finalCenter);
          defaultCameraPosition = new THREE.Vector3(
            finalCenter.x + 16,
            finalCenter.y + 12,
            finalCenter.z + 16
          );
          camera.position.copy(defaultCameraPosition);

          modelRoot.traverse((obj) => {
            if (!obj.isMesh) return;

            obj.material = obj.material.clone();

            if (ROOM_TO_NODE[obj.name]) {
              roomMeshes[obj.name] = obj;
              obj.userData.nodeId = ROOM_TO_NODE[obj.name];
              obj.userData.originalColor = obj.material.color
                ? obj.material.color.clone()
                : new THREE.Color("#e8e3da");

              if ("emissive" in obj.material) {
                obj.material.emissive = new THREE.Color(0x000000);
                obj.material.emissiveIntensity = 0;
              }
            }
          });

          applyRoomColors();
        },
        undefined,
        (error) => {
          console.error("GLB load error:", error);
          statusText.textContent = "Failed to load 3D model.";
        }
      );

      renderer.domElement.addEventListener("pointerdown", onRoomClick);
      animate();
    }

    function applyRoomColors() {
      Object.values(roomMeshes).forEach((mesh) => {
        const nodeId = mesh.userData.nodeId;
        const node = nodes.find(n => n.id === nodeId);

        if (enableLiveColors && mesh.material.color) {
          mesh.material.color.copy(getRoomColor(node?.telemetry?.aqi));
        } else if (mesh.material.color && mesh.userData.originalColor) {
          mesh.material.color.copy(mesh.userData.originalColor);
        }

        if ("emissive" in mesh.material) {
          mesh.material.emissive.setHex(0x000000);
          mesh.material.emissiveIntensity = 0;
        }
      });

      if (selectedMesh && "emissive" in selectedMesh.material) {
        selectedMesh.material.emissive.setHex(0x3da9ff);
        selectedMesh.material.emissiveIntensity = 0.45;
      }
    }

    function selectRoom(mesh) {
      selectedMesh = mesh;
      applyRoomColors();

      const nodeId = mesh.userData.nodeId;
      const node = nodes.find(n => n.id === nodeId);
      if (node) showNodeInfo(node);

      const box = new THREE.Box3().setFromObject(mesh);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const distance = Math.max(maxDim * 2.5, 2);

      const offset = new THREE.Vector3(
        distance * 0.8,
        distance * 0.6,
        distance * 0.8
      );

      camera.position.copy(center.clone().add(offset));
      controls.target.copy(center);
      controls.update();
    }

    function onRoomClick(event) {
      if (!renderer || !camera) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(Object.values(roomMeshes), false);
      if (intersects.length > 0) {
        selectRoom(intersects[0].object);
      }
    }

    function resetView() {
      selectedMesh = null;
      infoTitle.textContent = "Select a room";
      infoContent.innerHTML = `
        <div class="empty-note">Click a room in the 3D model to view its telemetry.</div>
      `;
      applyRoomColors();
      camera.position.copy(defaultCameraPosition);
      controls.target.copy(defaultTarget);
      controls.update();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer) renderer.render(scene, camera);
    }

    function resizeThree() {
      if (!renderer || !camera) return;
      const width = threeContainer.clientWidth || 800;
      const height = threeContainer.clientHeight || 520;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    async function loadTwinData() {
      try {
        statusText.textContent = "Fetching twin telemetry...";

        const telemetryResponse = await fetch(TELEMETRY_URL);
        if (!telemetryResponse.ok) throw new Error(`Telemetry HTTP ${telemetryResponse.status}`);
        const telemetryData = await telemetryResponse.json();

        nodes = Object.keys(ROOM_TO_NODE).map((roomName) => {
          const nodeId = ROOM_TO_NODE[roomName];
          const telemetry = telemetryData[nodeId] || null;

          return {
            id: nodeId,
            label: telemetry?.room_no || roomName.replace("Room_", ""),
            telemetry: telemetry
          };
        });

        applyRoomColors();
        statusText.textContent = "Live twin telemetry loaded.";
      } catch (error) {
        console.error(error);
        statusText.textContent = "Failed to load twin telemetry.";
      }
    }

    resetViewBtn.addEventListener("click", resetView);

    toggleColorBtn.addEventListener("click", () => {
      enableLiveColors = !enableLiveColors;
      toggleColorBtn.textContent = `Live Room Colors: ${enableLiveColors ? "On" : "Off"}`;
      toggleColorBtn.classList.toggle("active", enableLiveColors);
      applyRoomColors();
    });

    let resizeTimeout;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        resizeThree();
      }, 150);
    });

    initThree();
    loadTwinData();
    setInterval(loadTwinData, 5000);
  </script>
</body>
</html>
