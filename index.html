<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D + 3D Digital Twin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #081224;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 8px;
      padding: 0 12px;
      font-size: clamp(24px, 4vw, 36px);
    }

    #status {
      margin: 10px 0 14px;
      padding: 0 12px;
      font-size: clamp(13px, 2vw, 15px);
      color: #d6d6d6;
    }

    .main-layout {
      width: min(96%, 1800px);
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr) minmax(0, 2fr);
      gap: 24px;
      align-items: start;
    }

    .graph-panel,
    .viewer-panel {
      background: #101a2f;
      border-radius: 16px;
      padding: 20px;
      min-height: 640px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .viewer-panel {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel-title {
      text-align: left;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
      color: white;
    }

    .canvas-wrap {
      width: 100%;
      overflow: hidden;
    }

    canvas#twinCanvas {
      background: transparent;
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      touch-action: manipulation;
    }

    #infoBox {
      width: 100%;
      padding: 20px;
      border-radius: 16px;
      background: #111b31;
      border: 1px solid #2b3a5c;
      text-align: left;
      display: none;
      position: sticky;
      top: 20px;
    }

    #infoTitle {
      margin: 0 0 16px 0;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: bold;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }

    .prop-card {
      background: #0d1730;
      border: 1px solid #2a3f69;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .prop-label {
      font-size: 13px;
      color: #9bb0d3;
      margin-bottom: 6px;
    }

    .prop-value {
      font-size: clamp(16px, 2vw, 20px);
      font-weight: bold;
      color: white;
      word-break: break-word;
    }

    .meta-row {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }

    .meta-card {
      background: #0b1428;
      border: 1px solid #223659;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .empty-note {
      color: #c7d2e6;
      font-size: 15px;
    }

    .viewer-stage {
      position: relative;
      flex: 1;
      min-height: 560px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a3f69;
      background:
        radial-gradient(circle at top, rgba(80,130,255,0.10), transparent 35%),
        linear-gradient(180deg, #0b1428 0%, #0a1324 100%);
    }

    #threeContainer {
      width: 100%;
      height: 100%;
      min-height: 560px;
      position: relative;
      touch-action: none;
      cursor: grab;
    }

    #threeContainer:active {
      cursor: grabbing;
    }

    .viewer-overlay {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 5;
      width: min(340px, calc(100% - 32px));
      padding: 16px;
      border-radius: 14px;
      background: rgba(17, 27, 49, 0.92);
      border: 1px solid #2b3a5c;
      text-align: left;
      backdrop-filter: blur(10px);
      display: none;
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    }

    .viewer-overlay h4 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .viewer-overlay .mini-line {
      margin: 6px 0;
      color: #dfe8f8;
      font-size: 14px;
    }

    .viewer-overlay .mini-label {
      color: #8fb0de;
      margin-right: 6px;
    }

    .viewer-tools {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .tool-btn {
      border: 1px solid #2a3f69;
      background: #0d1730;
      color: white;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tool-btn:hover {
      filter: brightness(1.08);
    }

    .tool-btn.active {
      outline: 2px solid white;
      outline-offset: 1px;
    }

    .viewer-note {
      margin-top: 12px;
      text-align: left;
      font-size: 13px;
      color: #b8c6df;
      line-height: 1.5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 12px;
      justify-content: flex-start;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d6e1f5;
      font-size: 13px;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
    }

    @media (max-width: 1450px) {
      .main-layout {
        grid-template-columns: 1fr;
      }

      .graph-panel,
      .viewer-panel {
        min-height: auto;
      }

      #infoBox {
        position: static;
      }
    }

    @media (max-width: 700px) {
      .main-layout {
        width: 94%;
        gap: 16px;
      }

      .graph-panel,
      .viewer-panel,
      #infoBox {
        padding: 14px;
        border-radius: 14px;
      }

      .prop-grid,
      .meta-row {
        grid-template-columns: 1fr;
      }

      #threeContainer,
      .viewer-stage {
        min-height: 420px;
      }

      .viewer-overlay {
        width: calc(100% - 24px);
        left: 12px;
        top: 12px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        margin-top: 16px;
      }

      #status {
        margin-bottom: 10px;
      }

      .graph-panel,
      .viewer-panel,
      #infoBox {
        padding: 12px;
      }

      .prop-card,
      .meta-card {
        padding: 10px 12px;
      }

      .prop-label {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>2D + 3D Digital Twin</h1>
  <div id="status">Loading twin graph...</div>

  <div class="main-layout">
    <div class="graph-panel">
      <div class="panel-title">2D Twin Graph</div>
      <div class="canvas-wrap">
        <canvas id="twinCanvas"></canvas>
      </div>
    </div>

    <div id="infoBox">
      <h3 id="infoTitle"></h3>
      <div id="infoContent"></div>
    </div>

    <div class="viewer-panel">
      <div class="panel-title">3D Twin Viewer</div>

      <div class="viewer-stage">
        <div id="viewerOverlay" class="viewer-overlay">
          <h4 id="overlayTitle">Room</h4>
          <div class="mini-line"><span class="mini-label">AQI:</span><span id="overlayAqi">-</span></div>
          <div class="mini-line"><span class="mini-label">Humidity:</span><span id="overlayHum">-</span></div>
          <div class="mini-line"><span class="mini-label">Temperature:</span><span id="overlayTemp">-</span></div>
          <div class="mini-line"><span class="mini-label">eCO2:</span><span id="overlayEco2">-</span></div>
        </div>

        <div id="threeContainer"></div>
      </div>

      <div class="viewer-tools">
        <button class="tool-btn" id="resetViewBtn">Reset View</button>
        <button class="tool-btn" id="toggleColorBtn">Live Room Colors: Off</button>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#35c9dc;"></span>Good</div>
        <div class="legend-item"><span class="legend-dot" style="background:#f2c94c;"></span>Moderate</div>
        <div class="legend-item"><span class="legend-dot" style="background:#eb5757;"></span>High</div>
      </div>

      <div class="viewer-note">
        Click a room in the real 3D model to zoom in and show that room’s data. Room colors stay neutral unless you turn on live room colors.
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const GRAPH_URL = "https://iot-dt-fn-new-bwcwe8cphmg9aren.southeastasia-01.azurewebsites.net/api/GetTwinGraph";
    const TELEMETRY_URL = "https://iot-dt-fn-new-bwcwe8cphmg9aren.southeastasia-01.azurewebsites.net/api/GetTwinTelemetry";

    const canvas = document.getElementById("twinCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");
    const infoBox = document.getElementById("infoBox");
    const infoTitle = document.getElementById("infoTitle");
    const infoContent = document.getElementById("infoContent");
    const graphPanel = document.querySelector(".graph-panel");

    const viewerOverlay = document.getElementById("viewerOverlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayAqi = document.getElementById("overlayAqi");
    const overlayHum = document.getElementById("overlayHum");
    const overlayTemp = document.getElementById("overlayTemp");
    const overlayEco2 = document.getElementById("overlayEco2");
    const resetViewBtn = document.getElementById("resetViewBtn");
    const toggleColorBtn = document.getElementById("toggleColorBtn");
    const threeContainer = document.getElementById("threeContainer");

    let nodes = [];
    let edges = [];

    const BASE_WIDTH = 1050;
    const BASE_HEIGHT = 700;

    const ROOM_TO_NODE = {
      Room_01: "Node_01",
      Room_02: "Node_02",
      Room_03: "Node_03",
      Room_04: "Node_04",
      Room_05: "Node_05",
      Room_06: "Node_06",
      Room_07: "Node_07",
      Room_08: "Node_08",
      Room_09: "Node_09",
      Room_10: "Node_10"
    };

    let ENABLE_LIVE_ROOM_COLORS = false;

    let scene, camera, renderer, controls, raycaster, mouse;
    let gltfRoot = null;
    let roomMeshes = {};
    let selectedRoomMesh = null;
    let defaultCameraPosition = new THREE.Vector3(13, 11, 13);
    let defaultTarget = new THREE.Vector3(0, 0, 0);

    function resizeCanvas() {
      const panelWidth = graphPanel.clientWidth - 40;
      const width = Math.max(320, Math.min(BASE_WIDTH, panelWidth));
      const height = Math.max(420, width * (BASE_HEIGHT / BASE_WIDTH));

      canvas.width = width;
      canvas.height = height;
      canvas.style.width = "100%";
      canvas.style.height = "auto";
    }

    function layoutGraph(rawNodes) {
      const w = canvas.width;
      const h = canvas.height;

      const centerX = w / 2;
      const centerY = h / 2;

      const sideOffset = Math.min(350, w * 0.33);
      const spacing = Math.min(90, h * 0.13);

      const positions = {
        "B10": { x: centerX, y: centerY },

        "Node_01": { x: centerX - sideOffset, y: centerY - spacing * 2 },
        "Node_02": { x: centerX - sideOffset, y: centerY - spacing },
        "Node_03": { x: centerX - sideOffset, y: centerY },
        "Node_04": { x: centerX - sideOffset, y: centerY + spacing },
        "Node_05": { x: centerX - sideOffset, y: centerY + spacing * 2 },

        "Node_06": { x: centerX + sideOffset, y: centerY - spacing * 2 },
        "Node_07": { x: centerX + sideOffset, y: centerY - spacing },
        "Node_08": { x: centerX + sideOffset, y: centerY },
        "Node_09": { x: centerX + sideOffset, y: centerY + spacing },
        "Node_10": { x: centerX + sideOffset, y: centerY + spacing * 2 }
      };

      rawNodes.forEach(node => {
        if (positions[node.id]) {
          node.x = positions[node.id].x;
          node.y = positions[node.id].y;
        } else {
          node.x = centerX;
          node.y = centerY;
        }
      });

      return rawNodes;
    }

    function getNodeRadius() {
      return Math.max(20, Math.min(30, canvas.width * 0.028));
    }

    function getNodeColor(node) {
      if (node.id === "B10") return "#b04bb3";

      const aqi = Number(node.telemetry?.aqi);

      if (aqi === 1) return "#35c9dc";
      if (aqi === 2) return "#f2c94c";
      if (aqi >= 3) return "#eb5757";

      return "#35c9dc";
    }

    function getRoomColorByAqi(aqi) {
      const num = Number(aqi);
      if (num === 1) return new THREE.Color("#35c9dc");
      if (num === 2) return new THREE.Color("#f2c94c");
      if (num >= 3) return new THREE.Color("#eb5757");
      return new THREE.Color("#e9e6df");
    }

    function drawArrow(x1, y1, x2, y2) {
      const nodeRadius = getNodeRadius();
      const headLength = Math.max(8, nodeRadius * 0.35);
      const angle = Math.atan2(y2 - y1, x2 - x1);

      const startX = x1 + nodeRadius * Math.cos(angle);
      const startY = y1 + nodeRadius * Math.sin(angle);
      const endX = x2 - nodeRadius * Math.cos(angle);
      const endY = y2 - nodeRadius * Math.sin(angle);

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(
        endX - headLength * Math.cos(angle - Math.PI / 6),
        endY - headLength * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        endX - headLength * Math.cos(angle + Math.PI / 6),
        endY - headLength * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
    }

    function drawGraph() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const nodeRadius = getNodeRadius();
      const lineWidth = Math.max(2, canvas.width * 0.003);
      const edgeFontSize = Math.max(10, Math.min(14, canvas.width * 0.014));
      const nodeFontSize = Math.max(11, Math.min(17, canvas.width * 0.016));

      edges.forEach(edge => {
        const source = nodes.find(n => n.id === edge.source);
        const target = nodes.find(n => n.id === edge.target);
        if (!source || !target) return;

        ctx.strokeStyle = "#b14acf";
        ctx.fillStyle = "#b14acf";
        ctx.lineWidth = lineWidth;
        drawArrow(source.x, source.y, target.x, target.y);

        const midX = (source.x + target.x) / 2;
        const midY = (source.y + target.y) / 2;
        const angle = Math.atan2(target.y - source.y, target.x - source.x);

        ctx.save();
        ctx.translate(midX, midY);
        ctx.rotate(angle);
        ctx.fillStyle = "#a1a1aa";
        ctx.font = `${edgeFontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText(edge.label || "", 0, -8);
        ctx.restore();
      });

      nodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, getNodeRadius(), 0, Math.PI * 2);
        ctx.fillStyle = getNodeColor(node);
        ctx.fill();

        ctx.lineWidth = Math.max(3, nodeRadius * 0.16);
        ctx.strokeStyle = "#d9d9d9";
        ctx.stroke();

        ctx.fillStyle = "#e6e6e6";
        ctx.font = `bold ${nodeFontSize}px Arial`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(node.label || node.id, node.x + getNodeRadius() + 8, node.y);
      });
    }

    function safeValue(value) {
      return value === null || value === undefined || value === "" ? "-" : value;
    }

    function propCard(label, value) {
      return `
        <div class="prop-card">
          <div class="prop-label">${label}</div>
          <div class="prop-value">${safeValue(value)}</div>
        </div>
      `;
    }

    function metaCard(label, value) {
      return `
        <div class="meta-card">
          <div class="prop-label">${label}</div>
          <div class="prop-value" style="font-size:16px;">${safeValue(value)}</div>
        </div>
      `;
    }

    function showOverlayForNode(node) {
      const t = node?.telemetry || {};
      overlayTitle.textContent = safeValue(t.room_no || node.label || node.id);
      overlayAqi.textContent = safeValue(t.aqi);
      overlayHum.textContent = safeValue(t.hum);
      overlayTemp.textContent = safeValue(t.temp);
      overlayEco2.textContent = safeValue(t.eco2);
      viewerOverlay.style.display = "block";
    }

    function showNodeInfo(node) {
      infoTitle.textContent = node.label || node.id;

      if (node.telemetry) {
        const t = node.telemetry;

        infoContent.innerHTML = `
          <div class="prop-grid">
            ${propCard("AQI", t.aqi)}
            ${propCard("eCO2", t.eco2)}
            ${propCard("Humidity", t.hum)}
            ${propCard("PM1", t.pm1)}
            ${propCard("PM2.5", t.pm25)}
            ${propCard("PM10", t.pm10)}
            ${propCard("Temperature", t.temp)}
            ${propCard("TVOC", t.tvoc)}
            ${propCard("MQ", t.mq)}
            ${propCard("Packet No.", t.pkt_no)}
          </div>

          <div class="meta-row">
            ${metaCard("Twin ID", node.id)}
            ${metaCard("Payload ID", t.id)}
            ${metaCard("Room No.", t.room_no)}
            ${metaCard("Created At", t.created_at)}
            ${metaCard("Last Updated", t.lastUpdated)}
            ${metaCard("Label", node.label || node.id)}
          </div>
        `;
      } else {
        infoContent.innerHTML = `
          <div class="empty-note">No telemetry available for this node.</div>
          <div class="meta-row">
            ${metaCard("Twin ID", node.id)}
            ${metaCard("Label", node.label || node.id)}
          </div>
        `;
      }

      infoBox.style.display = "block";
      showOverlayForNode(node);
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color("#0b1428");

      const width = threeContainer.clientWidth;
      const height = threeContainer.clientHeight;

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.copy(defaultCameraPosition);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      threeContainer.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.copy(defaultTarget);
      controls.minDistance = 2;
      controls.maxDistance = 50;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight1.position.set(12, 18, 10);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight2.position.set(-10, 8, -8);
      scene.add(dirLight2);

      const hemiLight = new THREE.HemisphereLight(0x9ec8ff, 0x1a2238, 1.2);
      scene.add(hemiLight);

      const loader = new GLTFLoader();
      loader.load(
        "B10.glb",
        (gltf) => {
          gltfRoot = gltf.scene;
          scene.add(gltfRoot);

          const box = new THREE.Box3().setFromObject(gltfRoot);
          const center = box.getCenter(new THREE.Vector3());
          gltfRoot.position.sub(center);

          const scaledBox = new THREE.Box3().setFromObject(gltfRoot);
          const size = scaledBox.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const fitScale = 8 / maxDim;
          gltfRoot.scale.setScalar(fitScale);

          const finalBox = new THREE.Box3().setFromObject(gltfRoot);
          const finalCenter = finalBox.getCenter(new THREE.Vector3());

          controls.target.copy(finalCenter);
          defaultTarget.copy(finalCenter);
          defaultCameraPosition = new THREE.Vector3(
            finalCenter.x + 13,
            finalCenter.y + 11,
            finalCenter.z + 13
          );
          camera.position.copy(defaultCameraPosition);

          registerRoomMeshes();
          applyRoomVisualState();
        },
        undefined,
        (error) => {
          console.error("Failed to load B10.glb", error);
        }
      );

      renderer.domElement.addEventListener("pointerdown", onModelPointerDown);
      animateThree();
    }

    function registerRoomMeshes() {
      roomMeshes = {};

      gltfRoot.traverse((obj) => {
        if (!obj.isMesh) return;

        obj.castShadow = false;
        obj.receiveShadow = false;

        if (ROOM_TO_NODE[obj.name]) {
          roomMeshes[obj.name] = obj;

          obj.userData.nodeId = ROOM_TO_NODE[obj.name];
          obj.userData.originalMaterial = obj.material.clone();

          obj.material = obj.material.clone();
          if ("emissive" in obj.material) {
            obj.material.emissive = new THREE.Color(0x000000);
            obj.material.emissiveIntensity = 0;
          }
        }
      });
    }

    function applyRoomVisualState() {
      Object.entries(roomMeshes).forEach(([roomName, mesh]) => {
        const nodeId = ROOM_TO_NODE[roomName];
        const node = nodes.find(n => n.id === nodeId);

        if (ENABLE_LIVE_ROOM_COLORS) {
          if (mesh.material.color) {
            mesh.material.color.copy(getRoomColorByAqi(node?.telemetry?.aqi));
          }
        } else {
          if (mesh.userData.originalMaterial?.color && mesh.material.color) {
            mesh.material.color.copy(mesh.userData.originalMaterial.color);
          }
        }

        if ("emissive" in mesh.material) {
          mesh.material.emissive.setHex(0x000000);
          mesh.material.emissiveIntensity = 0;
        }
      });

      if (selectedRoomMesh && selectedRoomMesh.material && "emissive" in selectedRoomMesh.material) {
        selectedRoomMesh.material.emissive.setHex(0x3da9ff);
        selectedRoomMesh.material.emissiveIntensity = 0.45;
      }
    }

    function selectRoomMesh(mesh) {
      selectedRoomMesh = mesh;
      applyRoomVisualState();

      const nodeId = mesh.userData.nodeId;
      const node = nodes.find(n => n.id === nodeId);
      if (node) {
        showNodeInfo(node);
      }

      zoomToObject(mesh);
    }

    function zoomToObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const distance = Math.max(maxDim * 3.3, 2.2);

      const offset = new THREE.Vector3(distance, distance * 0.9, distance);
      const newPosition = center.clone().add(offset);

      camera.position.copy(newPosition);
      controls.target.copy(center);
      controls.update();
    }

    function resetThreeView() {
      selectedRoomMesh = null;
      applyRoomVisualState();
      viewerOverlay.style.display = "none";
      camera.position.copy(defaultCameraPosition);
      controls.target.copy(defaultTarget);
      controls.update();
    }

    function onModelPointerDown(event) {
      if (!renderer || !camera || !gltfRoot) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const clickableMeshes = Object.values(roomMeshes);
      const intersects = raycaster.intersectObjects(clickableMeshes, false);

      if (intersects.length > 0) {
        selectRoomMesh(intersects[0].object);
      }
    }

    function animateThree() {
      requestAnimationFrame(animateThree);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function resizeThree() {
      if (!renderer || !camera) return;
      const width = threeContainer.clientWidth;
      const height = threeContainer.clientHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    canvas.addEventListener("click", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (event.clientX - rect.left) * scaleX;
      const mouseY = (event.clientY - rect.top) * scaleY;

      const clicked = nodes.find(node => {
        const dx = mouseX - node.x;
        const dy = mouseY - node.y;
        return Math.sqrt(dx * dx + dy * dy) <= getNodeRadius();
      });

      if (clicked) {
        showNodeInfo(clicked);

        const roomName = Object.keys(ROOM_TO_NODE).find(key => ROOM_TO_NODE[key] === clicked.id);
        if (roomName && roomMeshes[roomName]) {
          selectRoomMesh(roomMeshes[roomName]);
        }
      }
    });

    async function loadTwinGraph() {
      try {
        statusText.textContent = "Fetching twin graph...";

        const graphResponse = await fetch(GRAPH_URL);
        if (!graphResponse.ok) throw new Error(`Graph HTTP ${graphResponse.status}`);
        const graphData = await graphResponse.json();

        const telemetryResponse = await fetch(TELEMETRY_URL);
        if (!telemetryResponse.ok) throw new Error(`Telemetry HTTP ${telemetryResponse.status}`);
        const telemetryData = await telemetryResponse.json();

        resizeCanvas();
        nodes = layoutGraph(graphData.nodes || []);
        edges = graphData.edges || [];

        nodes = nodes.map(node => ({
          ...node,
          telemetry: telemetryData[node.id] || null
        }));

        drawGraph();
        applyRoomVisualState();
        statusText.textContent = "Live twin graph loaded.";

        if (!infoBox.style.display || infoBox.style.display === "none") {
          const defaultNode = nodes.find(n => n.id === "Node_01") || nodes.find(n => n.id !== "B10");
          if (defaultNode) showNodeInfo(defaultNode);
        }
      } catch (error) {
        console.error(error);
        statusText.textContent = "Failed to load twin graph.";
      }
    }

    resetViewBtn.addEventListener("click", resetThreeView);

    toggleColorBtn.addEventListener("click", () => {
      ENABLE_LIVE_ROOM_COLORS = !ENABLE_LIVE_ROOM_COLORS;
      toggleColorBtn.textContent = `Live Room Colors: ${ENABLE_LIVE_ROOM_COLORS ? "On" : "Off"}`;
      toggleColorBtn.classList.toggle("active", ENABLE_LIVE_ROOM_COLORS);
      applyRoomVisualState();
    });

    let resizeTimeout;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (nodes.length) {
          resizeCanvas();
          nodes = layoutGraph(nodes);
          drawGraph();
        }
        resizeThree();
      }, 150);
    });

    initThree();
    loadTwinGraph();
    setInterval(loadTwinGraph, 5000);
  </script>
</body>
</html>
