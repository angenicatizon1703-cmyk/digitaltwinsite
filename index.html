<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D + 3D Digital Twin</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #081224;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 8px;
      padding: 0 12px;
      font-size: clamp(24px, 4vw, 36px);
    }

    #status {
      margin: 10px 0 14px;
      padding: 0 12px;
      font-size: clamp(13px, 2vw, 15px);
      color: #d6d6d6;
    }

    .main-layout {
      width: min(96%, 1800px);
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr) minmax(0, 2fr);
      gap: 24px;
      align-items: start;
    }

    .graph-panel,
    .viewer-panel {
      background: #101a2f;
      border-radius: 16px;
      padding: 20px;
      min-height: 640px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .viewer-panel {
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      text-align: left;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
      color: white;
    }

    .canvas-wrap {
      width: 100%;
      overflow: hidden;
    }

    canvas {
      background: transparent;
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      touch-action: manipulation;
    }

    #infoBox {
      width: 100%;
      padding: 20px;
      border-radius: 16px;
      background: #111b31;
      border: 1px solid #2b3a5c;
      text-align: left;
      display: none;
      position: sticky;
      top: 20px;
    }

    #infoTitle {
      margin: 0 0 16px 0;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: bold;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }

    .prop-card {
      background: #0d1730;
      border: 1px solid #2a3f69;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .prop-label {
      font-size: 13px;
      color: #9bb0d3;
      margin-bottom: 6px;
    }

    .prop-value {
      font-size: clamp(16px, 2vw, 20px);
      font-weight: bold;
      color: white;
      word-break: break-word;
    }

    .meta-row {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }

    .meta-card {
      background: #0b1428;
      border: 1px solid #223659;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .empty-note {
      color: #c7d2e6;
      font-size: 15px;
    }

    .viewer-stage {
      flex: 1;
      min-height: 520px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a3f69;
      background:
        radial-gradient(circle at top, rgba(80,130,255,0.10), transparent 35%),
        linear-gradient(180deg, #0b1428 0%, #0a1324 100%);
      padding: 10px;
    }

    model-viewer {
      width: 100%;
      min-height: 500px;
      height: 100%;
      background: transparent;
      border-radius: 12px;
    }

    .room-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .room-btn {
      border: 1px solid #2a3f69;
      background: #0d1730;
      color: white;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .room-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .room-btn.active {
      outline: 2px solid white;
      outline-offset: 1px;
    }

    .viewer-note {
      margin-top: 12px;
      text-align: left;
      font-size: 13px;
      color: #b8c6df;
      line-height: 1.5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 12px;
      justify-content: flex-start;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d6e1f5;
      font-size: 13px;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .selected-status {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #0d1730;
      border: 1px solid #2a3f69;
      text-align: left;
      color: #dfe8f8;
      line-height: 1.5;
      min-height: 78px;
    }

    @media (max-width: 1450px) {
      .main-layout {
        grid-template-columns: 1fr;
      }

      .graph-panel,
      .viewer-panel {
        min-height: auto;
      }

      #infoBox {
        position: static;
      }
    }

    @media (max-width: 700px) {
      .main-layout {
        width: 94%;
        gap: 16px;
      }

      .graph-panel,
      .viewer-panel,
      #infoBox {
        padding: 14px;
        border-radius: 14px;
      }

      .prop-grid,
      .meta-row,
      .room-buttons {
        grid-template-columns: 1fr;
      }

      model-viewer {
        min-height: 380px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        margin-top: 16px;
      }

      #status {
        margin-bottom: 10px;
      }

      .graph-panel,
      .viewer-panel,
      #infoBox {
        padding: 12px;
      }

      .prop-card,
      .meta-card {
        padding: 10px 12px;
      }

      .prop-label {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>2D + 3D Digital Twin</h1>
  <div id="status">Loading twin graph...</div>

  <div class="main-layout">
    <div class="graph-panel">
      <div class="panel-title">2D Twin Graph</div>
      <div class="canvas-wrap">
        <canvas id="twinCanvas"></canvas>
      </div>
    </div>

    <div id="infoBox">
      <h3 id="infoTitle"></h3>
      <div id="infoContent"></div>
    </div>

    <div class="viewer-panel">
      <div class="panel-title">3D Twin Viewer</div>

      <div class="viewer-stage">
        <model-viewer
          id="buildingModel"
          src="B10.glb"
          alt="B10 3D Digital Twin Model"
          camera-controls
          auto-rotate
          shadow-intensity="1"
          exposure="1"
          environment-image="neutral"
          interaction-prompt="auto">
        </model-viewer>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#35c9dc;"></span>Good</div>
        <div class="legend-item"><span class="legend-dot" style="background:#f2c94c;"></span>Moderate</div>
        <div class="legend-item"><span class="legend-dot" style="background:#eb5757;"></span>High</div>
      </div>

      <div class="selected-status" id="selectedStatus">
        Select a room below to show its sensor summary.
      </div>

      <div class="room-buttons" id="roomButtons">
        <button class="room-btn" data-node-id="Node_01">Room 10.1.1</button>
        <button class="room-btn" data-node-id="Node_02">Room 10.1.2</button>
        <button class="room-btn" data-node-id="Node_03">Room 10.1.3</button>
        <button class="room-btn" data-node-id="Node_04">Room 10.1.4</button>
        <button class="room-btn" data-node-id="Node_05">Room 10.1.5</button>
        <button class="room-btn" data-node-id="Node_06">Room 10.1.6</button>
        <button class="room-btn" data-node-id="Node_07">Room 10.1.7</button>
        <button class="room-btn" data-node-id="Node_08">Room 10.1.8</button>
        <button class="room-btn" data-node-id="Node_09">Room 10.1.9</button>
        <button class="room-btn" data-node-id="Node_10">Room 10.1.10</button>
      </div>

      <div class="viewer-note">
        This public 3D panel uses your uploaded <strong>B10.glb</strong> model and your live Azure Function telemetry.
      </div>
    </div>
  </div>

  <script>
    const GRAPH_URL = "https://iot-dt-fn-new-bwcwe8cphmg9aren.southeastasia-01.azurewebsites.net/api/GetTwinGraph";
    const TELEMETRY_URL = "https://iot-dt-fn-new-bwcwe8cphmg9aren.southeastasia-01.azurewebsites.net/api/GetTwinTelemetry";

    const canvas = document.getElementById("twinCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");
    const infoBox = document.getElementById("infoBox");
    const infoTitle = document.getElementById("infoTitle");
    const infoContent = document.getElementById("infoContent");
    const graphPanel = document.querySelector(".graph-panel");
    const roomButtons = document.querySelectorAll(".room-btn");
    const selectedStatus = document.getElementById("selectedStatus");

    let nodes = [];
    let edges = [];

    const BASE_WIDTH = 1050;
    const BASE_HEIGHT = 700;

    function resizeCanvas() {
      const panelWidth = graphPanel.clientWidth - 40;
      const width = Math.max(320, Math.min(BASE_WIDTH, panelWidth));
      const height = Math.max(420, width * (BASE_HEIGHT / BASE_WIDTH));

      canvas.width = width;
      canvas.height = height;
      canvas.style.width = "100%";
      canvas.style.height = "auto";
    }

    function layoutGraph(rawNodes) {
      const w = canvas.width;
      const h = canvas.height;

      const centerX = w / 2;
      const centerY = h / 2;

      const sideOffset = Math.min(350, w * 0.33);
      const spacing = Math.min(90, h * 0.13);

      const positions = {
        "B10": { x: centerX, y: centerY },

        "Node_01": { x: centerX - sideOffset, y: centerY - spacing * 2 },
        "Node_02": { x: centerX - sideOffset, y: centerY - spacing },
        "Node_03": { x: centerX - sideOffset, y: centerY },
        "Node_04": { x: centerX - sideOffset, y: centerY + spacing },
        "Node_05": { x: centerX - sideOffset, y: centerY + spacing * 2 },

        "Node_06": { x: centerX + sideOffset, y: centerY - spacing * 2 },
        "Node_07": { x: centerX + sideOffset, y: centerY - spacing },
        "Node_08": { x: centerX + sideOffset, y: centerY },
        "Node_09": { x: centerX + sideOffset, y: centerY + spacing },
        "Node_10": { x: centerX + sideOffset, y: centerY + spacing * 2 }
      };

      rawNodes.forEach(node => {
        if (positions[node.id]) {
          node.x = positions[node.id].x;
          node.y = positions[node.id].y;
        } else {
          node.x = centerX;
          node.y = centerY;
        }
      });

      return rawNodes;
    }

    function getNodeRadius() {
      return Math.max(20, Math.min(30, canvas.width * 0.028));
    }

    function getNodeColor(node) {
      if (node.id === "B10") return "#b04bb3";

      const aqi = Number(node.telemetry?.aqi);

      if (aqi === 1) return "#35c9dc";
      if (aqi === 2) return "#f2c94c";
      if (aqi >= 3) return "#eb5757";

      return "#35c9dc";
    }

    function getRoomColorByAqi(aqi) {
      const num = Number(aqi);
      if (num === 1) return "#35c9dc";
      if (num === 2) return "#f2c94c";
      if (num >= 3) return "#eb5757";
      return "#35c9dc";
    }

    function drawArrow(x1, y1, x2, y2) {
      const nodeRadius = getNodeRadius();
      const headLength = Math.max(8, nodeRadius * 0.35);
      const angle = Math.atan2(y2 - y1, x2 - x1);

      const startX = x1 + nodeRadius * Math.cos(angle);
      const startY = y1 + nodeRadius * Math.sin(angle);
      const endX = x2 - nodeRadius * Math.cos(angle);
      const endY = y2 - nodeRadius * Math.sin(angle);

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(
        endX - headLength * Math.cos(angle - Math.PI / 6),
        endY - headLength * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        endX - headLength * Math.cos(angle + Math.PI / 6),
        endY - headLength * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
    }

    function drawGraph() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const nodeRadius = getNodeRadius();
      const lineWidth = Math.max(2, canvas.width * 0.003);
      const edgeFontSize = Math.max(10, Math.min(14, canvas.width * 0.014));
      const nodeFontSize = Math.max(11, Math.min(17, canvas.width * 0.016));

      edges.forEach(edge => {
        const source = nodes.find(n => n.id === edge.source);
        const target = nodes.find(n => n.id === edge.target);
        if (!source || !target) return;

        ctx.strokeStyle = "#b14acf";
        ctx.fillStyle = "#b14acf";
        ctx.lineWidth = lineWidth;
        drawArrow(source.x, source.y, target.x, target.y);

        const midX = (source.x + target.x) / 2;
        const midY = (source.y + target.y) / 2;
        const angle = Math.atan2(target.y - source.y, target.x - source.x);

        ctx.save();
        ctx.translate(midX, midY);
        ctx.rotate(angle);
        ctx.fillStyle = "#a1a1aa";
        ctx.font = `${edgeFontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText(edge.label || "", 0, -8);
        ctx.restore();
      });

      nodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, getNodeRadius(), 0, Math.PI * 2);
        ctx.fillStyle = getNodeColor(node);
        ctx.fill();

        ctx.lineWidth = Math.max(3, nodeRadius * 0.16);
        ctx.strokeStyle = "#d9d9d9";
        ctx.stroke();

        ctx.fillStyle = "#e6e6e6";
        ctx.font = `bold ${nodeFontSize}px Arial`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(node.label || node.id, node.x + getNodeRadius() + 8, node.y);
      });
    }

    function safeValue(value) {
      return value === null || value === undefined || value === "" ? "-" : value;
    }

    function propCard(label, value) {
      return `
        <div class="prop-card">
          <div class="prop-label">${label}</div>
          <div class="prop-value">${safeValue(value)}</div>
        </div>
      `;
    }

    function metaCard(label, value) {
      return `
        <div class="meta-card">
          <div class="prop-label">${label}</div>
          <div class="prop-value" style="font-size:16px;">${safeValue(value)}</div>
        </div>
      `;
    }

    function getAqiStatusText(aqi) {
      const num = Number(aqi);
      if (num === 1) return "Air quality is good";
      if (num === 2) return "Air quality is moderate";
      if (num >= 3) return "Air quality is high";
      return "Air quality status unavailable";
    }

    function getHumidityStatusText(hum) {
      const num = Number(hum);
      if (Number.isNaN(num)) return "Humidity unavailable";
      if (num < 30) return "Humidity is low";
      if (num <= 60) return "Humidity is acceptable";
      return "Humidity is not good";
    }

    function showSelectedStatus(node) {
      if (!node || !node.telemetry) {
        selectedStatus.innerHTML = `No room data available.`;
        return;
      }

      const t = node.telemetry;
      selectedStatus.innerHTML = `
        <strong>${safeValue(t.room_no || node.label || node.id)}</strong><br>
        ${getAqiStatusText(t.aqi)}: <strong>${safeValue(t.aqi)}</strong><br>
        ${getHumidityStatusText(t.hum)}: <strong>${safeValue(t.hum)}</strong>
      `;
    }

    function showNodeInfo(node) {
      infoTitle.textContent = node.label || node.id;

      if (node.telemetry) {
        const t = node.telemetry;

        infoContent.innerHTML = `
          <div class="prop-grid">
            ${propCard("AQI", t.aqi)}
            ${propCard("eCO2", t.eco2)}
            ${propCard("Humidity", t.hum)}
            ${propCard("PM1", t.pm1)}
            ${propCard("PM2.5", t.pm25)}
            ${propCard("PM10", t.pm10)}
            ${propCard("Temperature", t.temp)}
            ${propCard("TVOC", t.tvoc)}
            ${propCard("MQ", t.mq)}
            ${propCard("Packet No.", t.pkt_no)}
          </div>

          <div class="meta-row">
            ${metaCard("Twin ID", node.id)}
            ${metaCard("Payload ID", t.id)}
            ${metaCard("Room No.", t.room_no)}
            ${metaCard("Created At", t.created_at)}
            ${metaCard("Last Updated", t.lastUpdated)}
            ${metaCard("Label", node.label || node.id)}
          </div>
        `;
      } else {
        infoContent.innerHTML = `
          <div class="empty-note">No telemetry available for this node.</div>
          <div class="meta-row">
            ${metaCard("Twin ID", node.id)}
            ${metaCard("Label", node.label || node.id)}
          </div>
        `;
      }

      infoBox.style.display = "block";
      setActiveRoomButton(node.id);
      showSelectedStatus(node);
    }

    function setActiveRoomButton(nodeId) {
      roomButtons.forEach(button => {
        const isActive = button.dataset.nodeId === nodeId;
        button.classList.toggle("active", isActive);

        const node = nodes.find(n => n.id === button.dataset.nodeId);
        const color = getRoomColorByAqi(node?.telemetry?.aqi);
        button.style.background = color;
        button.style.color = "#081224";
      });
    }

    canvas.addEventListener("click", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (event.clientX - rect.left) * scaleX;
      const mouseY = (event.clientY - rect.top) * scaleY;

      const clicked = nodes.find(node => {
        const dx = mouseX - node.x;
        const dy = mouseY - node.y;
        return Math.sqrt(dx * dx + dy * dy) <= getNodeRadius();
      });

      if (clicked) showNodeInfo(clicked);
    });

    roomButtons.forEach(button => {
      button.addEventListener("click", () => {
        const node = nodes.find(n => n.id === button.dataset.nodeId);
        if (node) showNodeInfo(node);
      });
    });

    async function loadTwinGraph() {
      try {
        statusText.textContent = "Fetching twin graph...";

        const graphResponse = await fetch(GRAPH_URL);
        if (!graphResponse.ok) throw new Error(`Graph HTTP ${graphResponse.status}`);
        const graphData = await graphResponse.json();

        const telemetryResponse = await fetch(TELEMETRY_URL);
        if (!telemetryResponse.ok) throw new Error(`Telemetry HTTP ${telemetryResponse.status}`);
        const telemetryData = await telemetryResponse.json();

        resizeCanvas();
        nodes = layoutGraph(graphData.nodes || []);
        edges = graphData.edges || [];

        nodes = nodes.map(node => ({
          ...node,
          telemetry: telemetryData[node.id] || null
        }));

        drawGraph();
        setActiveRoomButton("Node_06");
        statusText.textContent = "Live twin graph loaded.";

        if (!infoBox.style.display || infoBox.style.display === "none") {
          const defaultNode = nodes.find(n => n.id === "Node_06") || nodes.find(n => n.id !== "B10");
          if (defaultNode) showNodeInfo(defaultNode);
        }
      } catch (error) {
        console.error(error);
        statusText.textContent = "Failed to load twin graph.";
      }
    }

    let resizeTimeout;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (nodes.length) {
          resizeCanvas();
          nodes = layoutGraph(nodes);
          drawGraph();
        }
      }, 150);
    });

    loadTwinGraph();
    setInterval(loadTwinGraph, 5000);
  </script>
</body>
</html>
